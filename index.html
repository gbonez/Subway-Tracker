<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gbonez.org</title>
  <link rel="icon" type="image/x-icon" href="forrest.ico">

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --accent-color: #4a9eff;
      --border-color: #333;
      --highlight-color: #1e1e1e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(circle at 12% 18%, rgba(74, 158, 255, 0.22), transparent 24%),
        radial-gradient(circle at 88% 14%, rgba(108, 92, 231, 0.18), transparent 22%),
        linear-gradient(155deg, #090b11 0%, #101522 40%, #1a1430 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -18%;
      pointer-events: none;
      z-index: 0;
      filter: blur(82px);
      opacity: 0.72;
      will-change: transform, opacity;
    }

    body::before {
      background:
        radial-gradient(circle at 14% 26%, rgba(74, 158, 255, 0.38), transparent 18%),
        radial-gradient(circle at 72% 68%, rgba(108, 92, 231, 0.34), transparent 24%),
        radial-gradient(circle at 42% 88%, rgba(74, 158, 255, 0.18), transparent 16%),
        radial-gradient(circle at 88% 22%, rgba(45, 112, 255, 0.2), transparent 18%);
      animation: driftOne 14s ease-in-out infinite alternate, pulseOne 11s ease-in-out infinite;
    }

    body::after {
      background:
        radial-gradient(circle at 84% 20%, rgba(74, 158, 255, 0.26), transparent 16%),
        radial-gradient(circle at 26% 58%, rgba(108, 92, 231, 0.36), transparent 20%),
        radial-gradient(circle at 82% 82%, rgba(74, 158, 255, 0.18), transparent 14%),
        radial-gradient(circle at 50% 20%, rgba(124, 97, 255, 0.14), transparent 16%);
      animation: driftTwo 18s ease-in-out infinite alternate, pulseTwo 13s ease-in-out infinite;
    }

    .container {
      max-width: 640px;
      width: 100%;
      min-height: calc(100vh - 4rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent-color), #6c5ce7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .section-card {
      background: rgba(22, 24, 34, 0.58);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      text-decoration: none;
      color: var(--text-color);
      display: block;
      transition: 0.3s ease;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .section-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 18px 42px rgba(74, 158, 255, 0.18);
    }

    .section-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .section-description {
      color: #aaa;
      line-height: 1.6;
      font-size: 1rem;
    }

    .footer {
      margin-top: 3rem;
      color: #666;
      font-size: 0.9rem;
    }

    @keyframes driftOne {
      from {
        transform: translate3d(-4%, -2%, 0) scale(1);
      }

      to {
        transform: translate3d(5%, 3%, 0) scale(1.14);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate3d(4%, -3%, 0) scale(1.02);
      }

      to {
        transform: translate3d(-6%, 4%, 0) scale(1.16);
      }
    }

    @keyframes pulseOne {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 0.85;
      }
    }

    @keyframes pulseTwo {

      0%,
      100% {
        opacity: 0.48;
      }

      50% {
        opacity: 0.78;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .section-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>gbonez.org</h1>

    <p class="subtitle">
      Tools just for me to use :)
    </p>

    <div class="sections">

      <a href="subway/" class="section-card">
        <div class="section-icon">🚇</div>
        <div class="section-title">Subway</div>
        <p class="section-description">
          Tracking my personal subway usage.
        </p>
      </a>

      <a href="movies/" class="section-card">
        <div class="section-icon">🎬</div>
        <div class="section-title">Movies</div>
        <p class="section-description">
          Metrograph showtimes linked to my Letterboxd.
        </p>
      </a>

      <a href="clothes/" class="section-card">
        <div class="section-icon">👗</div>
        <div class="section-title">Clothes</div>
        <p class="section-description">
          Coming soon.
        </p>
      </a>

      <a href="music/" class="section-card">
        <div class="section-icon">🎵</div>
        <div class="section-title">Music</div>
        <p class="section-description">
          Coming soon.
        </p>
      </a>

    </div>

    <div class="footer">
      <p>Made with ❤️</p>
    </div>

  </div>
</body>

</html>
