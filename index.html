<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gbonez.org</title>
  <link rel="icon" type="image/x-icon" href="forrest.ico">

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --accent-color: #4a9eff;
      --border-color: #333;
      --highlight-color: #1e1e1e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(74, 158, 255, 0.18), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(108, 92, 231, 0.16), transparent 24%),
        linear-gradient(160deg, #101216 0%, #121620 42%, #161426 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: 0;
      filter: blur(70px);
      opacity: 0.55;
    }

    body::before {
      background:
        radial-gradient(circle at 18% 32%, rgba(74, 158, 255, 0.28), transparent 24%),
        radial-gradient(circle at 68% 70%, rgba(108, 92, 231, 0.22), transparent 26%),
        radial-gradient(circle at 38% 82%, rgba(74, 158, 255, 0.1), transparent 18%);
      animation: driftOne 18s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(circle at 78% 24%, rgba(74, 158, 255, 0.14), transparent 20%),
        radial-gradient(circle at 30% 62%, rgba(108, 92, 231, 0.24), transparent 22%),
        radial-gradient(circle at 84% 84%, rgba(74, 158, 255, 0.12), transparent 18%);
      animation: driftTwo 22s ease-in-out infinite alternate;
    }

    .container {
      max-width: 640px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent-color), #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .section-card {
      background: rgba(30, 30, 30, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      text-decoration: none;
      color: var(--text-color);
      display: block;
      transition: 0.3s ease;
    }

    .section-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
      box-shadow: 0 12px 30px rgba(74, 158, 255, 0.12);
    }

    .section-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .section-description {
      color: #aaa;
      line-height: 1.6;
      font-size: 1rem;
    }

    .footer {
      margin-top: 3rem;
      color: #666;
      font-size: 0.9rem;
    }

    @keyframes driftOne {
      from {
        transform: translate3d(-2%, -1%, 0) scale(1);
      }

      to {
        transform: translate3d(3%, 2%, 0) scale(1.06);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate3d(2%, -2%, 0) scale(1);
      }

      to {
        transform: translate3d(-3%, 3%, 0) scale(1.08);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .section-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>gbonez.org</h1>

    <p class="subtitle">
      Tools just for me to use :)
    </p>

    <div class="sections">

      <a href="subway/" class="section-card">
        <div class="section-icon">🚇</div>
        <div class="section-title">Subway</div>
        <p class="section-description">
          Tracking my personal subway usage.
        </p>
      </a>

      <a href="movies/" class="section-card">
        <div class="section-icon">🎬</div>
        <div class="section-title">Movies</div>
        <p class="section-description">
          Metrograph showtimes linked to my Letterboxd.
        </p>
      </a>

      <a href="clothes/" class="section-card">
        <div class="section-icon">👗</div>
        <div class="section-title">Clothes</div>
        <p class="section-description">
          Coming soon.
        </p>
      </a>

      <a href="music/" class="section-card">
        <div class="section-icon">🎵</div>
        <div class="section-title">Music</div>
        <p class="section-description">
          Coming soon.
        </p>
      </a>

    </div>

    <div class="footer">
      <p>Made with ❤️</p>
    </div>

  </div>
</body>

</html>
