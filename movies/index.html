<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrograph Showtimes</title>
    <link rel="icon" type="image/x-icon" href="../forrest.ico">

    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #4a9eff;
            --border-color: #333;
            --highlight-color: #1e1e1e;
            --input-bg: #1e1e1e;
            --button-bg: #333;
            --button-text: #fff;
            --watchlist-color: #f5c542;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
        }

        a.back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            color: #888;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        a.back-home:hover {
            color: var(--text-color);
        }

        .top-bar {
            max-width: 800px;
            margin: 0 auto 2rem;
        }

        h1 {
            font-size: 2.25rem;
            margin-bottom: 0.4rem;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-color), #6c5ce7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .button-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .updated-at {
            color: #666;
            font-size: 0.85rem;
        }

        button.scrape-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid #555;
            border-radius: 6px;
            padding: 0.45em 1em;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.scrape-btn:hover {
            background-color: #444;
        }

        button.scrape-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #scrape-status {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Filter bar */
        .filter-bar {
            max-width: 800px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar label {
            font-size: 0.85rem;
            color: #888;
        }

        .filter-bar input[type="text"],
        .filter-bar select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 0.4em 0.75em;
            font-size: 0.9rem;
        }

        .filter-bar input[type="checkbox"] {
            margin-right: 0.3em;
            accent-color: var(--watchlist-color);
        }

        /* Film list */
        #film-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .film-card {
            background: var(--highlight-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            transition: border-color 0.2s;
        }

        .film-card.watchlist {
            border-left: 3px solid var(--watchlist-color);
        }

        .film-title-row {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .film-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .film-title a {
            color: var(--text-color);
            text-decoration: none;
        }

        .film-title a:hover {
            color: var(--accent-color);
        }

        .badge-watchlist {
            font-size: 0.75rem;
            background: rgba(245, 197, 66, 0.15);
            color: var(--watchlist-color);
            border: 1px solid rgba(245, 197, 66, 0.3);
            border-radius: 4px;
            padding: 0.15em 0.5em;
            white-space: nowrap;
        }

        .badge-watched {
            font-size: 0.75rem;
            background: rgba(74, 158, 255, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 4px;
            padding: 0.15em 0.5em;
            white-space: nowrap;
        }

        .badge-special-event {
            font-size: 0.75rem;
            background: rgba(232, 72, 85, 0.16);
            color: #ff8a92;
            border: 1px solid rgba(232, 72, 85, 0.38);
            border-radius: 4px;
            padding: 0.15em 0.5em;
            white-space: nowrap;
        }

        .badge-friends {
            font-size: 0.75rem;
            background: rgba(76, 175, 80, 0.15);
            color: #7edc86;
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 4px;
            padding: 0.15em 0.5em;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        button.badge-friends {
            appearance: none;
            font-family: inherit;
        }

        .badge-friends:hover {
            background: rgba(76, 175, 80, 0.22);
            border-color: rgba(126, 220, 134, 0.5);
            transform: translateY(-1px);
        }

        .badge-friends:focus-visible {
            outline: 2px solid rgba(126, 220, 134, 0.6);
            outline-offset: 2px;
        }

        .film-meta {
            font-size: 0.82rem;
            color: #777;
            margin-bottom: 0.75rem;
        }

        .film-meta span {
            margin-right: 0.75rem;
        }

        .rating {
            color: #f5c542;
            font-weight: 500;
        }

        .personal-rating {
            color: var(--accent-color);
            font-weight: 500;
        }

        .friend-rating {
            color: #7edc86;
            font-weight: 500;
        }

        .component-ratings {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.85rem;
        }

        .component-rating-row {
            background: #202020;
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 0.65rem 0.8rem;
        }

        .component-rating-title-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }

        .component-rating-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #dddddd;
        }

        .component-rating-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            font-size: 0.8rem;
            color: #8a8a8a;
        }

        .showings-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 0.4rem;
        }

        .showings-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .showing-chip {
            font-size: 0.8rem;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            padding: 0.25em 0.6em;
            white-space: nowrap;
            color: #ccc;
        }

        .showing-chip.sold-out {
            color: #8a8a8a;
            text-decoration: line-through;
            opacity: 0.75;
        }

        .showing-chip a {
            color: inherit;
            text-decoration: none;
        }

        .showing-chip a:hover {
            color: var(--accent-color);
        }

        .showing-chip .chip-date {
            color: #666;
            margin-right: 0.3em;
        }

        #loading,
        #error {
            max-width: 800px;
            margin: 2rem auto;
            font-size: 1rem;
        }

        #error {
            color: #ff6b6b;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 9, 7, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-window {
            width: min(560px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            background: #181818;
            border: 1px solid #2d4732;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            padding: 1.15rem 1.15rem 1.25rem;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .modal-kicker {
            font-size: 0.74rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7edc86;
            margin-bottom: 0.4rem;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .modal-subtitle {
            margin-top: 0.35rem;
            color: #92a394;
            font-size: 0.9rem;
        }

        .modal-close {
            appearance: none;
            border: 1px solid #3d3d3d;
            background: #242424;
            color: #b7b7b7;
            border-radius: 999px;
            width: 2rem;
            height: 2rem;
            font-size: 1rem;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .modal-close:hover {
            background: #2e2e2e;
            color: #fff;
        }

        .ratings-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .ratings-summary-card {
            background: #202020;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            padding: 0.8rem 0.9rem;
        }

        .ratings-summary-label {
            font-size: 0.72rem;
            color: #8c8c8c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }

        .ratings-summary-value {
            font-size: 1.15rem;
            color: var(--text-color);
            font-weight: 600;
        }

        .ratings-chart {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .rating-row {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) 32px;
            align-items: center;
            gap: 0.75rem;
        }

        .rating-label,
        .rating-count {
            font-size: 0.82rem;
            color: #c6c6c6;
        }

        .rating-bar-track {
            height: 1.1rem;
            background: #232323;
            border: 1px solid #2f2f2f;
            border-radius: 999px;
            overflow: hidden;
        }

        .rating-bar-fill {
            height: 100%;
            min-width: 0;
            background: linear-gradient(90deg, #65c36f 0%, #98e19b 100%);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .ratings-empty {
            padding: 1rem;
            border: 1px dashed #355138;
            border-radius: 12px;
            color: #9ab39d;
            text-align: center;
            background: rgba(76, 175, 80, 0.08);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.75rem;
            }

            .film-card {
                padding: 1rem;
            }

            .modal-window {
                padding: 1rem;
            }

            .rating-row {
                grid-template-columns: 34px minmax(0, 1fr) 28px;
                gap: 0.55rem;
            }
        }
    </style>
</head>

<body>

    <a href="/" class="back-home">← Return to Home</a>

    <div class="top-bar">
        <h1><span class="gradient-text">Metrograph</span> 🎬</h1>
        <div class="meta-row">
            <span class="updated-at" id="updated-at">Loading...</span>
            <div class="button-row">
                <button class="scrape-btn" id="metrograph-btn" onclick="runMetrographScrape()">↻ Refresh
                    Metrograph</button>
                <button class="scrape-btn" id="letterboxd-btn" onclick="runLetterboxdSync()">★ Update Letterboxd
                    Table</button>
            </div>
            <span id="scrape-status"></span>
        </div>
    </div>

    <div class="filter-bar">
        <input type="text" id="search" placeholder="Search films..." oninput="renderFilms()" style="width:200px;">
        <label><input type="checkbox" id="watchlist-only" onchange="renderFilms()"> Watchlist only</label>
        <select id="date-filter" onchange="renderFilms()">
            <option value="">All dates</option>
        </select>
        <select id="sort-by" onchange="renderFilms()">
            <option value="default">Default</option>
            <option value="soonest">Soonest date</option>
            <option value="special_event">Special events</option>
            <option value="friend_avg">Highest avg friend rating</option>
            <option value="friend_count">Highest friend watch count</option>
            <option value="public_rating">Highest public rating</option>
            <option value="personal_rating">Highest personal rating</option>
        </select>
    </div>

    <div id="loading">Loading schedule...</div>
    <div id="error" style="display:none;"></div>
    <div id="film-list" style="display:none;"></div>

    <div id="ratings-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="ratings-modal-title">
            <div class="modal-header">
                <div>
                    <div class="modal-kicker">Friend Rating Breakdown</div>
                    <div id="ratings-modal-title" class="modal-title"></div>
                    <div id="ratings-modal-subtitle" class="modal-subtitle"></div>
                </div>
                <button id="ratings-modal-close" class="modal-close" type="button"
                    aria-label="Close rating breakdown">×</button>
            </div>
            <div id="ratings-modal-summary" class="ratings-summary"></div>
            <div id="ratings-modal-chart" class="ratings-chart"></div>
        </div>
    </div>

    <script>
        function getApiBase() {
            const isLocalStaticPage = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
            const isRailwayApp = window.location.hostname.endsWith('up.railway.app');

            if (isLocalStaticPage) {
                return 'http://127.0.0.1:8010';
            }

            if (isRailwayApp) {
                return window.location.origin;
            }

            return 'https://subway-tracker-production.up.railway.app';
        }

        const API = getApiBase();
        let allFilms = [];
        const ratingSteps = Array.from({ length: 10 }, (_, index) => (index + 1) * 0.5);

        const ratingsModal = document.getElementById('ratings-modal');
        const ratingsModalTitle = document.getElementById('ratings-modal-title');
        const ratingsModalSubtitle = document.getElementById('ratings-modal-subtitle');
        const ratingsModalSummary = document.getElementById('ratings-modal-summary');
        const ratingsModalChart = document.getElementById('ratings-modal-chart');

        function formatRatingLabel(value) {
            return value.toFixed(1);
        }

        function buildRatingDistribution(friendWatchers) {
            const counts = new Map(ratingSteps.map(step => [step, 0]));
            const numericRatings = (friendWatchers || []).filter(watcher => watcher && watcher.rating != null);

            numericRatings.forEach(watcher => {
                const roundedRating = Math.round(watcher.rating * 2) / 2;
                if (counts.has(roundedRating)) {
                    counts.set(roundedRating, counts.get(roundedRating) + 1);
                }
            });

            return {
                numericRatings,
                counts: [...ratingSteps].reverse().map(step => ({
                    label: formatRatingLabel(step),
                    value: step,
                    count: counts.get(step) || 0,
                })),
            };
        }

        function openFriendRatingsModal(film) {
            const friendWatchers = Array.isArray(film.friend_watchers) ? film.friend_watchers : [];
            const { numericRatings, counts } = buildRatingDistribution(friendWatchers);
            const maxCount = Math.max(...counts.map(item => item.count), 0);
            const averageLabel = film.friend_avg_rating != null ? `★ ${film.friend_avg_rating.toFixed(2)}` : 'No average';

            ratingsModalTitle.textContent = film.title;
            ratingsModalSubtitle.textContent = `${numericRatings.length} numeric ratings from ${film.friend_watch_count || 0} friends watched`;
            ratingsModalSummary.innerHTML = `
                <div class="ratings-summary-card">
                    <div class="ratings-summary-label">Friends Watched</div>
                    <div class="ratings-summary-value">${film.friend_watch_count || 0}</div>
                </div>
                <div class="ratings-summary-card">
                    <div class="ratings-summary-label">Numeric Ratings</div>
                    <div class="ratings-summary-value">${numericRatings.length}</div>
                </div>
                <div class="ratings-summary-card">
                    <div class="ratings-summary-label">Friend Average</div>
                    <div class="ratings-summary-value">${averageLabel}</div>
                </div>
            `;

            if (!numericRatings.length) {
                ratingsModalChart.innerHTML = '<div class="ratings-empty">No numeric friend ratings are stored for this movie yet.</div>';
            } else {
                ratingsModalChart.innerHTML = counts.map(item => {
                    const width = maxCount > 0 ? (item.count / maxCount) * 100 : 0;
                    return `
                        <div class="rating-row">
                            <div class="rating-label">${item.label}</div>
                            <div class="rating-bar-track">
                                <div class="rating-bar-fill" style="width:${width}%;"></div>
                            </div>
                            <div class="rating-count">${item.count}</div>
                        </div>
                    `;
                }).join('');
            }

            ratingsModal.classList.add('open');
            ratingsModal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeFriendRatingsModal() {
            ratingsModal.classList.remove('open');
            ratingsModal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        function getSortValue(value, fallback = -1) {
            return value == null ? fallback : value;
        }

        function getSoonestTimestamp(film) {
            const timestamps = film.showings.map(showing => new Date(`${showing.date}T00:00:00`).getTime());
            return timestamps.length ? Math.min(...timestamps) : Number.POSITIVE_INFINITY;
        }

        function getFilmBestRating(film) {
            const componentRatings = Array.isArray(film.rating_components)
                ? film.rating_components.map(component => component.letterboxd_rating).filter(rating => rating != null)
                : [];

            if (componentRatings.length) {
                return Math.max(...componentRatings);
            }

            if (film.letterboxd_rating != null) {
                return film.letterboxd_rating;
            }

            if (film.friend_avg_rating != null) {
                return film.friend_avg_rating;
            }

            if (film.personal_rating != null) {
                return film.personal_rating;
            }

            return -1;
        }

        function sortFilms(films, sortBy) {
            const sorted = [...films];

            sorted.sort((a, b) => {
                if (sortBy === 'soonest') {
                    return getSoonestTimestamp(a) - getSoonestTimestamp(b) || a.title.localeCompare(b.title);
                }

                if (sortBy === 'friend_avg') {
                    return getSortValue(b.friend_avg_rating) - getSortValue(a.friend_avg_rating) || a.title.localeCompare(b.title);
                }

                if (sortBy === 'friend_count') {
                    return getSortValue(b.friend_watch_count) - getSortValue(a.friend_watch_count) || a.title.localeCompare(b.title);
                }

                if (sortBy === 'public_rating') {
                    return getSortValue(b.letterboxd_rating) - getSortValue(a.letterboxd_rating) || a.title.localeCompare(b.title);
                }

                if (sortBy === 'personal_rating') {
                    return getSortValue(b.personal_rating) - getSortValue(a.personal_rating) || a.title.localeCompare(b.title);
                }

                if (sortBy === 'special_event') {
                    const specialEventOrder = (b.special_event === a.special_event) ? 0 : (b.special_event ? 1 : -1);
                    if (specialEventOrder !== 0) return specialEventOrder;

                    return getFilmBestRating(b) - getFilmBestRating(a)
                        || getSortValue(b.friend_watch_count) - getSortValue(a.friend_watch_count)
                        || a.title.localeCompare(b.title);
                }

                const watchlistSpecialOrder = ((b.on_watchlist && b.special_event) === (a.on_watchlist && a.special_event))
                    ? 0
                    : ((b.on_watchlist && b.special_event) ? 1 : -1);
                if (watchlistSpecialOrder !== 0) return watchlistSpecialOrder;

                const watchlistOrder = (a.on_watchlist === b.on_watchlist) ? 0 : (a.on_watchlist ? -1 : 1);
                if (watchlistOrder !== 0) return watchlistOrder;

                const friendCountOrder = getSortValue(b.friend_watch_count) - getSortValue(a.friend_watch_count);
                if (friendCountOrder !== 0) return friendCountOrder;

                const specialEventOrder = (b.special_event === a.special_event) ? 0 : (b.special_event ? 1 : -1);
                if (specialEventOrder !== 0) return specialEventOrder;

                const friendAvgOrder = getSortValue(b.friend_avg_rating) - getSortValue(a.friend_avg_rating);
                if (friendAvgOrder !== 0) return friendAvgOrder;

                const publicRatingOrder = getSortValue(b.letterboxd_rating) - getSortValue(a.letterboxd_rating);
                if (publicRatingOrder !== 0) return publicRatingOrder;

                return a.title.localeCompare(b.title);
            });

            return sorted;
        }

        async function loadSchedule() {
            try {
                const res = await fetch(`${API}/movies/schedule`);
                if (!res.ok) {
                    if (res.status === 404) {
                        showError('No schedule yet. Click "Refresh Schedule" to scrape Metrograph.');
                    } else {
                        showError(`Failed to load schedule (${res.status}).`);
                    }
                    return;
                }
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('film-list').style.display = 'flex';
                document.getElementById('updated-at').textContent = `Last updated: ${data.updated_at || 'unknown'}`;
                allFilms = data.films || [];
                populateDateFilter();
                renderFilms();
            } catch (e) {
                showError('Could not reach the server.');
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function populateDateFilter() {
            const dates = new Set();
            allFilms.forEach(f => f.showings.forEach(s => dates.add(s.date)));
            const sorted = [...dates].sort();
            const sel = document.getElementById('date-filter');
            sorted.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = formatDate(d);
                sel.appendChild(opt);
            });
        }

        function formatDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderFilms() {
            const query = document.getElementById('search').value.toLowerCase();
            const watchlistOnly = document.getElementById('watchlist-only').checked;
            const dateFilter = document.getElementById('date-filter').value;
            const sortBy = document.getElementById('sort-by').value;

            let films = allFilms;

            if (watchlistOnly) films = films.filter(f => f.on_watchlist);
            if (query) films = films.filter(f =>
                f.title.toLowerCase().includes(query) ||
                (f.director && f.director.toLowerCase().includes(query))
            );
            if (dateFilter) films = films.filter(f => f.showings.some(s => s.date === dateFilter));

            films = sortFilms(films, sortBy);

            const list = document.getElementById('film-list');
            list.innerHTML = '';

            if (!films.length) {
                list.innerHTML = '<p style="color:#666;">No films match your filters.</p>';
                return;
            }

            films.forEach(film => {
                const showings = dateFilter
                    ? film.showings.filter(s => s.date === dateFilter)
                    : film.showings;
                const ratingComponents = Array.isArray(film.rating_components) ? film.rating_components : [];
                const showComponentRatings = ratingComponents.length > 1
                    || (ratingComponents.length === 1 && ratingComponents[0].title && ratingComponents[0].title !== film.title);

                const card = document.createElement('div');
                card.className = 'film-card' + (film.on_watchlist ? ' watchlist' : '');

                const ratingHtml = film.letterboxd_rating != null
                    ? `<span class="rating">★ ${film.letterboxd_rating.toFixed(1)}</span>`
                    : '';

                const personalRatingHtml = film.personal_rating != null
                    ? `<span class="personal-rating">Your rating ★ ${film.personal_rating.toFixed(1)}</span>`
                    : '';

                const friendRatingHtml = film.friend_avg_rating != null
                    ? `<span class="friend-rating">Friend rating ★ ${film.friend_avg_rating.toFixed(2)}</span>`
                    : '';

                const specialEventBadgeHtml = film.special_event
                    ? `<span class="badge-special-event" title="${(film.special_event_reason || 'Likely a special event').replace(/"/g, '&quot;')}">Special Event</span>`
                    : '';

                const friendsBadgeHtml = !showComponentRatings && film.friend_watch_count > 0
                    ? `<button type="button" class="badge-friends"># of Friends watched: ${film.friend_watch_count}</button>`
                    : '';

                const componentRatingsHtml = showComponentRatings
                    ? `<div class="component-ratings">${ratingComponents.map((component, index) => {
                        const componentPublicRatingHtml = component.letterboxd_rating != null
                            ? `<span class="rating">★ ${component.letterboxd_rating.toFixed(1)}</span>`
                            : '';
                        const componentPersonalRatingHtml = component.personal_rating != null
                            ? `<span class="personal-rating">Your rating ★ ${component.personal_rating.toFixed(1)}</span>`
                            : '';
                        const componentFriendRatingHtml = component.friend_avg_rating != null
                            ? `<span class="friend-rating">Friend rating ★ ${component.friend_avg_rating.toFixed(2)}</span>`
                            : '';
                        const componentFriendsBadgeHtml = component.friend_watch_count > 0
                            ? `<button type="button" class="badge-friends" data-component-index="${index}"># of Friends watched: ${component.friend_watch_count}</button>`
                            : '';
                        return `
                            <div class="component-rating-row">
                                <div class="component-rating-title-row">
                                    <span class="component-rating-title">${escapeHtml(component.title)}</span>
                                    ${component.on_watchlist ? '<span class="badge-watchlist">★ Watchlist</span>' : ''}
                                    ${component.watched ? '<span class="badge-watched">Seen</span>' : ''}
                                    ${componentFriendsBadgeHtml}
                                </div>
                                <div class="component-rating-meta">
                                    ${componentPublicRatingHtml}
                                    ${componentPersonalRatingHtml}
                                    ${componentFriendRatingHtml}
                                </div>
                            </div>
                        `;
                    }).join('')}</div>`
                    : '';

                const chipHtml = showings.map(s => {
                    const dateLabel = `<span class="chip-date">${formatDate(s.date)}</span>`;
                    const timeLabel = s.time;
                    const inner = `${dateLabel}${timeLabel}`;
                    const soldOutClass = s.sold_out ? ' sold-out' : '';
                    return `<span class="showing-chip${soldOutClass}">${s.ticket_url ? `<a href="${s.ticket_url}" target="_blank" rel="noopener">${inner}</a>` : inner}</span>`;
                }).join('');

                card.innerHTML = `
          <div class="film-title-row">
            <span class="film-title">
              <a href="${film.film_url}" target="_blank" rel="noopener">${film.title}</a>
            </span>
            ${film.on_watchlist ? '<span class="badge-watchlist">★ Watchlist</span>' : ''}
            ${film.watched ? '<span class="badge-watched">Seen</span>' : ''}
            ${specialEventBadgeHtml}
            ${friendsBadgeHtml}
          </div>
          <div class="film-meta">
            ${film.director ? `<span>${film.director}</span>` : ''}
            ${film.year ? `<span>${film.year}</span>` : ''}
            ${film.runtime ? `<span>${film.runtime}</span>` : ''}
            ${film.format ? `<span>${film.format}</span>` : ''}
                        ${showComponentRatings ? '' : ratingHtml}
                        ${showComponentRatings ? '' : personalRatingHtml}
                        ${showComponentRatings ? '' : friendRatingHtml}
          </div>
                    ${componentRatingsHtml}
          <div class="showings-label">Showings</div>
          <div class="showings-grid">${chipHtml}</div>
        `;
                card.querySelectorAll('.badge-friends').forEach(button => {
                    const componentIndex = button.getAttribute('data-component-index');
                    const modalTarget = componentIndex != null ? ratingComponents[Number(componentIndex)] : film;
                    button.addEventListener('click', () => openFriendRatingsModal(modalTarget));
                });
                list.appendChild(card);
            });
        }

        async function runMetrographScrape() {
            const btn = document.getElementById('metrograph-btn');
            const status = document.getElementById('scrape-status');
            btn.disabled = true;
            status.textContent = 'Refreshing Metrograph using stored Letterboxd data…';
            document.getElementById('error').style.display = 'none';

            try {
                const res = await fetch(`${API}/movies/scrape`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    status.textContent = '';
                    showError(`Scrape failed: ${err.detail || res.status}`);
                    return;
                }
                const data = await res.json();
                document.getElementById('film-list').style.display = 'flex';
                document.getElementById('updated-at').textContent = `Last updated: ${data.updated_at || 'unknown'}`;
                allFilms = data.films || [];
                // Reset date filter options
                const sel = document.getElementById('date-filter');
                sel.innerHTML = '<option value="">All dates</option>';
                populateDateFilter();
                renderFilms();
                status.textContent = `✓ Updated — ${allFilms.length} films found.`;
            } catch (e) {
                status.textContent = '';
                showError('Could not reach the server.');
            } finally {
                btn.disabled = false;
            }
        }

        async function runLetterboxdSync() {
            const btn = document.getElementById('letterboxd-btn');
            const status = document.getElementById('scrape-status');
            btn.disabled = true;
            status.textContent = 'Updating the stored Letterboxd table… this can take a while.';
            document.getElementById('error').style.display = 'none';

            try {
                const res = await fetch(`${API}/movies/letterboxd-sync`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    status.textContent = '';
                    showError(`Letterboxd sync failed: ${err.detail || res.status}`);
                    return;
                }

                const data = await res.json();
                status.textContent = `✓ ${data.message} Click Refresh Metrograph to apply it to the page.`;
            } catch (e) {
                status.textContent = '';
                showError('Could not reach the server.');
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('ratings-modal-close').addEventListener('click', closeFriendRatingsModal);
        ratingsModal.addEventListener('click', (event) => {
            if (event.target === ratingsModal) {
                closeFriendRatingsModal();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && ratingsModal.classList.contains('open')) {
                closeFriendRatingsModal();
            }
        });

        loadSchedule();
    </script>

</body>
