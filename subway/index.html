<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Tracker</title>
  <link rel="icon" type="image/x-icon" href="../forrest.ico">

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --accent-color: #4a9eff;
      --border-color: #333;
      --highlight-color: #1e1e1e;
      --input-bg: #1e1e1e;
      --input-border: #444;
      --button-bg: #333;
      --button-text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      color: #888;
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      transition: color 0.2s;
    }

    .back-home:hover {
      color: var(--text-color);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.75rem;
      margin-bottom: 0.75rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--accent-color), #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .section-card {
      background-color: var(--highlight-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 1.25rem;
      transition: 0.25s ease;
      text-align: left;
    }

    .section-card:hover {
      border-color: var(--accent-color);
      box-shadow: 0 6px 20px rgba(74, 158, 255, 0.1);
      transform: translateY(-1px);
    }

    .section-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .section-description {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.25rem;
      }

      .section-card {
        padding: 1.25rem;
      }
    }
  </style>
</head>

<body>

  <a href="/" class="back-home">← Return to Home</a>

  <div class="main">

    <h1><span class="gradient-text">Subway Tracker</span> 🚇</h1>
    <p class="subtitle">
      My personal transit log.
    </p>

    <div class="sections">

      <a href="rides/" class="section-card">
        <div class="section-icon">🗂️</div>
        <div>
          <div class="section-title">Record Ride</div>
          <p class="section-description">Log a new subway ride or browse ride history.</p>
        </div>
      </a>

      <a href="favorites/" class="section-card">
        <div class="section-icon">⭐</div>
        <div>
          <div class="section-title">Favorites</div>
          <p class="section-description">View and manage saved favorite routes.</p>
        </div>
      </a>

      <a href="stats/" class="section-card">
        <div class="section-icon">📊</div>
        <div>
          <div class="section-title">Statistics</div>
          <p class="section-description">Explore charts and breakdowns of ride history.</p>
        </div>
      </a>

    </div>

  </div>

</body>

</html>
